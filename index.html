<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Studs Mudd | Unified Scouting Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: radial-gradient(circle at 30% 10%, #1a0000 0%, #000000 100%); min-height: 100vh; padding: 1.5rem; }
        .studs-container { max-width: 1400px; margin: 0 auto; background: rgba(8, 0, 0, 0.85); backdrop-filter: blur(3px); border-radius: 2rem; border: 1px solid #dc2626; box-shadow: 0 20px 40px rgba(220, 38, 38, 0.3); overflow: hidden; }
        .header { background: #0c0000; padding: 1rem 2rem; border-bottom: 3px solid #dc2626; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
        .logo h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #ff4d4d, #b91c1c); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 2px; }
        .logo p { color: #b77; font-size: 0.7rem; }
        .user-panel { background: #1f0808; padding: 0.5rem 1.2rem; border-radius: 60px; display: flex; align-items: center; gap: 1rem; border: 1px solid #dc2626; flex-wrap: wrap; }
        .user-greeting { color: #ffc0c0; font-weight: 600; }
        .role-badge { background: #b91c1c; padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.8rem; font-weight: bold; color: white; }
        .logout-btn { background: none; border: 1px solid #dc5e5e; color: #ffb3b3; padding: 0.3rem 0.8rem; border-radius: 30px; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: #dc2626; color: black; }
        .dashboard { padding: 2rem; min-height: 500px; }
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .player-card { background: #0f0303; border-radius: 1.2rem; border: 1px solid #b22222; padding: 1.2rem; transition: 0.2s; }
        .player-card:hover { border-color: #ff4d4d; transform: translateY(-3px); }
        .player-name { font-size: 1.4rem; font-weight: bold; color: #ff8a8a; border-left: 4px solid #dc2626; padding-left: 0.6rem; margin-bottom: 0.5rem; }
        .player-detail { color: #d4b0b0; font-size: 0.85rem; margin: 0.4rem 0; }
        .contact-info { background: #1e0a0a; padding: 0.7rem; border-radius: 0.8rem; margin: 0.6rem 0; border: 1px solid #9e2a2a; }
        .contact-label { color: #ff9999; font-weight: bold; }
        .scout-tag { display: inline-block; background: #5e1a1a; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.7rem; margin-top: 0.4rem; }
        .form-card { background: #0f0303; border-radius: 1.5rem; padding: 1.5rem; border: 1px solid #b91c1c; max-width: 600px; margin-bottom: 2rem; }
        .section-title { font-size: 1.4rem; font-weight: bold; color: #dc2626; margin-bottom: 1.2rem; border-left: 5px solid #dc2626; padding-left: 0.8rem; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; color: #e6b3b3; margin-bottom: 0.3rem; font-size: 0.85rem; }
        input, select, textarea { width: 100%; background: #1f0c0c; border: 1px solid #a53b3b; padding: 0.7rem; border-radius: 1rem; color: #fff0f0; }
        button { background: #b91c1c; border: none; padding: 0.7rem 1.5rem; border-radius: 2rem; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; margin-top: 0.3rem; }
        button:hover { background: #dc2626; transform: scale(0.97); }
        .btn-outline { background: transparent; border: 1px solid #dc2626; color: #ffa2a2; }
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-modal { background: #0a0101; border: 2px solid #dc2626; border-radius: 2rem; width: 92%; max-width: 480px; padding: 2rem; }
        .auth-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #dc2626; }
        .auth-tab { flex: 1; text-align: center; padding: 0.6rem; background: none; color: #dd9898; border-radius: 0; border-bottom: 2px solid transparent; cursor: pointer; }
        .auth-tab.active { color: #ff5e5e; border-bottom: 2px solid #dc2626; }
        .error-msg { background: #3e1212; padding: 0.5rem; border-radius: 1rem; color: #ffa0a0; font-size: 0.8rem; margin-bottom: 1rem; text-align: center; }
        .status-area { position: fixed; bottom: 20px; right: 20px; background: #0a0101; border: 1px solid #dc2626; border-radius: 1rem; padding: 0.5rem 1rem; font-size: 0.75rem; color: #ff9999; z-index: 1000; font-family: monospace; opacity: 0.9; }
        .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #00cc00; margin-right: 6px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .loading { text-align: center; padding: 3rem; color: #ff9999; }
        .empty-state { text-align: center; color: #aa6f6f; padding: 3rem; }
        @media (max-width: 700px) { .dashboard { padding: 1rem; } .header { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
<div class="studs-container" id="appRoot"></div>
<div class="status-area" id="globalStatus"><span class="live-dot"></span> System ready</div>

<script>
    // ========== YOUR DEPLOYED GOOGLE APPS SCRIPT URL ==========
    const API_URL = "YOUR_DEPLOYED_URL_HERE";  // <-- PASTE YOUR URL HERE
    
    // Helper: show temporary status
    function setStatus(msg, isError = false) {
        const el = document.getElementById("globalStatus");
        if (el) {
            el.innerHTML = msg;
            el.style.background = isError ? "#3e1212" : "#0a3a1a";
            setTimeout(() => {
                if (document.getElementById("globalStatus"))
                    document.getElementById("globalStatus").innerHTML = '<span class="live-dot"></span> System ready';
            }, 2500);
        }
    }
    
    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    
    // ========== BACKEND COMMUNICATION ==========
    async function apiCall(action, payload) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            const data = await response.json();
            return data;
        } catch (err) {
            console.error(err);
            return { success: false, message: "Network error" };
        }
    }
    
    async function fetchPlayers() {
        try {
            const response = await fetch(API_URL, { method: 'GET', mode: 'cors' });
            const data = await response.json();
            if (data.success) return data.players;
            else return [];
        } catch (err) {
            console.error(err);
            setStatus("Could not load players", true);
            return [];
        }
    }
    
    // ========== AUTHENTICATION (server‑side) ==========
    async function signup(username, password, role) {
        if (password.length < 3) return { success: false, error: "Password must be at least 3 characters" };
        const userId = (role === "scout" ? "scout_" : "player_") + Date.now() + "_" + Math.random().toString(36).substr(2,6);
        const result = await apiCall("signup", {
            userId, username, password, role,
            fullName: username, position: "", club: "", age: "", contactEmail: "", contactPhone: "", bio: ""
        });
        if (result.success) {
            // store session
            sessionStorage.setItem("currentUser", JSON.stringify({ id: userId, username, role }));
            return { success: true };
        } else {
            return { success: false, error: result.message };
        }
    }
    
    async function login(username, password) {
        const result = await apiCall("login", { username, password });
        if (result.success) {
            sessionStorage.setItem("currentUser", JSON.stringify({
                id: result.userId,
                username: result.username,
                role: result.role
            }));
            return { success: true };
        } else {
            return { success: false, error: result.message };
        }
    }
    
    function getCurrentUser() {
        const raw = sessionStorage.getItem("currentUser");
        return raw ? JSON.parse(raw) : null;
    }
    
    function logout() {
        sessionStorage.removeItem("currentUser");
        window.location.reload();
    }
    
    // ========== PLAYER PROFILE UPDATE ==========
    async function updateProfile(userId, profile) {
        return await apiCall("update_profile", { userId, ...profile });
    }
    
    // ========== UI RENDERING ==========
    let authModalActive = false;
    let authTab = "login";
    let authError = "";
    let signupRole = "player";
    let currentPlayers = [];
    let isLoading = true;
    
    function showAuth(initialTab = "login", error = "") {
        authModalActive = true;
        authTab = initialTab;
        authError = error;
        signupRole = "player";
        renderApp();
    }
    
    function closeAuth() {
        authModalActive = false;
        authError = "";
        renderApp();
    }
    
    async function handleLogin(u, p) {
        if (!u.trim() || !p.trim()) { showAuth("login", "Fill both fields"); return; }
        const res = await login(u, p);
        if (res.success) {
            closeAuth();
            if (getCurrentUser().role === "scout") await loadPlayers();
            renderApp();
        } else {
            showAuth("login", res.error);
        }
    }
    
    async function handleSignup(u, p, role) {
        if (!u.trim() || !p.trim()) { showAuth("signup", "Fill all fields"); return; }
        const res = await signup(u, p, role);
        if (res.success) {
            closeAuth();
            if (role === "scout") await loadPlayers();
            renderApp();
        } else {
            showAuth("signup", res.error);
        }
    }
    
    async function loadPlayers() {
        isLoading = true;
        renderApp();
        currentPlayers = await fetchPlayers();
        isLoading = false;
        renderApp();
    }
    
    async function renderApp() {
        const root = document.getElementById("appRoot");
        const user = getCurrentUser();
        
        // Not logged in
        if (!user) {
            root.innerHTML = `
                <div class="header"><div class="logo"><h1>◉ STUD$ MUDD ◉</h1><p>central scouting network</p></div><button id="openAuthBtn" style="background:#b91c1c;">⚡ ENTER</button></div>
                <div class="dashboard" style="text-align:center; padding:3rem;"><div style="background:#0f0303; border-radius:2rem; padding:2rem; max-width:650px; margin:0 auto;">
                <h2 style="color:#dc2626;">Unified Platform</h2><p style="margin:1rem 0;">All data is shared across every device. Sign up once, access everywhere.</p>
                <button id="joinBtn" class="btn-outline">Join Now</button></div></div>
            `;
            document.getElementById("openAuthBtn")?.addEventListener("click", () => showAuth("login"));
            document.getElementById("joinBtn")?.addEventListener("click", () => showAuth("signup"));
            if (authModalActive) renderAuthModal();
            return;
        }
        
        // SCOUT DASHBOARD
        if (user.role === "scout") {
            if (isLoading) {
                root.innerHTML = `<div class="header"><div class="logo"><h1>🔍 SCOUT MODE</h1></div><div class="user-panel"><span>${escapeHtml(user.username)}</span><button id="logoutBtn" class="logout-btn">EXIT</button></div></div><div class="loading">⟳ Loading directory...</div>`;
                document.getElementById("logoutBtn")?.addEventListener("click", logout);
                return;
            }
            root.innerHTML = `
                <div class="header"><div class="logo"><h1>🔍 STUD$ MUDD · SCOUT MODE</h1><p>${currentPlayers.length} active profiles</p></div>
                <div class="user-panel"><span class="user-greeting">👁️ ${escapeHtml(user.username)}</span><span class="role-badge">SCOUT</span><button id="logoutBtn" class="logout-btn">EXIT</button></div></div>
                <div class="dashboard"><div class="section-title">📋 PLAYER DIRECTORY</div><div class="players-grid">
                ${currentPlayers.map(p => `
                    <div class="player-card"><div class="player-name">⚡ ${escapeHtml(p.fullName)}</div>
                    <div class="player-detail"><strong>🎯 Position:</strong> ${escapeHtml(p.position)}</div>
                    <div class="player-detail"><strong>🏟️ Club:</strong> ${escapeHtml(p.club)}</div>
                    <div class="player-detail"><strong>📅 Age:</strong> ${escapeHtml(p.age)}</div>
                    <div class="contact-info"><div><span class="contact-label">📧 Email:</span> ${escapeHtml(p.contactEmail)}</div>
                    <div><span class="contact-label">📞 Phone:</span> ${escapeHtml(p.contactPhone)}</div></div>
                    <div class="player-detail"><strong>📝 Bio:</strong> ${escapeHtml(p.bio.substring(0,120))}</div>
                    <div class="scout-tag">Full contact visible</div></div>
                `).join('')}
                ${currentPlayers.length === 0 ? '<div class="empty-state">✨ No players yet. Share the platform to grow the directory.</div>' : ''}
                </div></div>
            `;
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
            return;
        }
        
        // PLAYER DASHBOARD
        if (user.role === "player") {
            root.innerHTML = `
                <div class="header"><div class="logo"><h1>⭐ PLAYER ZONE</h1><p>complete your profile</p></div>
                <div class="user-panel"><span>🎮 ${escapeHtml(user.username)}</span><span class="role-badge">PLAYER</span><button id="logoutBtn" class="logout-btn">EXIT</button></div></div>
                <div class="dashboard"><div class="form-card"><div class="section-title">📝 YOUR PROFILE</div>
                <div class="input-group"><label>Full Name *</label><input id="fullName" placeholder="Real name"></div>
                <div class="input-group"><label>Position</label><input id="position" placeholder="e.g., Striker"></div>
                <div class="input-group"><label>Club</label><input id="club" placeholder="Club name"></div>
                <div class="input-group"><label>Age</label><input id="age" placeholder="e.g., 21"></div>
                <div class="input-group"><label>📧 Contact Email (scouts see this)</label><input id="email" type="email" placeholder="your@email.com"></div>
                <div class="input-group"><label>📞 Contact Phone (scouts see this)</label><input id="phone" placeholder="+1234567890"></div>
                <div class="input-group"><label>Bio / Highlights</label><textarea id="bio" rows="3" placeholder="Tell scouts about your skills..."></textarea></div>
                <button id="saveBtn">💾 SAVE PROFILE</button>
                <hr><div style="background:#1e0a0a; border-radius:1rem; padding:0.8rem;"><p style="color:#ffb3b3;">✅ Your profile is instantly visible to all scouts.</p></div></div></div>
            `;
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
            document.getElementById("saveBtn")?.addEventListener("click", async () => {
                const profile = {
                    fullName: document.getElementById("fullName").value,
                    position: document.getElementById("position").value,
                    club: document.getElementById("club").value,
                    age: document.getElementById("age").value,
                    contactEmail: document.getElementById("email").value,
                    contactPhone: document.getElementById("phone").value,
                    bio: document.getElementById("bio").value
                };
                const res = await updateProfile(user.id, profile);
                if (res.success) {
                    setStatus("Profile saved!");
                    alert("✅ Your profile has been saved. Scouts can now see your information.");
                } else {
                    setStatus("Error saving profile", true);
                }
            });
        }
        
        if (authModalActive && !getCurrentUser()) renderAuthModal();
    }
    
    function renderAuthModal() {
        const existing = document.getElementById("authModal");
        if (existing) existing.remove();
        const root = document.getElementById("appRoot");
        if (!root) return;
        const modalDiv = document.createElement("div");
        modalDiv.id = "authModal";
        modalDiv.className = "auth-overlay";
        modalDiv.innerHTML = `
            <div class="auth-modal"><div class="auth-tabs"><button id="tabLogin" class="auth-tab ${authTab === 'login' ? 'active' : ''}">LOGIN</button><button id="tabSignup" class="auth-tab ${authTab === 'signup' ? 'active' : ''}">SIGN UP</button></div>
            ${authError ? `<div class="error-msg">⚠️ ${escapeHtml(authError)}</div>` : ""}
            <div id="authForm"></div><div style="margin-top:1rem; text-align:center;"><button id="closeModal" class="btn-outline">Cancel</button></div></div>
        `;
        root.appendChild(modalDiv);
        
        const renderForm = () => {
            const container = document.getElementById("authForm");
            if (authTab === "login") {
                container.innerHTML = `<div class="input-group"><label>Username</label><input id="loginUser" type="text"></div><div class="input-group"><label>Password</label><input id="loginPass" type="password"></div><button id="doLogin">ENTER ⚡</button><p style="color:#aa6f6f; font-size:0.7rem; margin-top:0.8rem;">Demo scout: talent_scout / redscout</p>`;
                document.getElementById("doLogin")?.addEventListener("click", () => {
                    const u = document.getElementById("loginUser").value;
                    const p = document.getElementById("loginPass").value;
                    handleLogin(u, p);
                });
            } else {
                container.innerHTML = `<div class="input-group"><label>Username *</label><input id="signUser" type="text"></div><div class="input-group"><label>Password * (min 3)</label><input id="signPass" type="password"></div><div class="input-group"><label>I am a:</label><select id="signRole"><option value="player">⚽ Player (Get discovered)</option><option value="scout">🔍 Scout (Discover talent)</option></select></div><button id="doSignup">CREATE ACCOUNT</button>`;
                document.getElementById("doSignup")?.addEventListener("click", () => {
                    const u = document.getElementById("signUser").value;
                    const p = document.getElementById("signPass").value;
                    const r = document.getElementById("signRole").value;
                    handleSignup(u, p, r);
                });
            }
        };
        
        document.getElementById("tabLogin")?.addEventListener("click", () => { authTab = "login"; authError = ""; renderAuthModal(); });
        document.getElementById("tabSignup")?.addEventListener("click", () => { authTab = "signup"; authError = ""; renderAuthModal(); });
        document.getElementById("closeModal")?.addEventListener("click", closeAuth);
        renderForm();
    }
    
    // Start the app: pre‑load players if a scout is already logged in
    (async () => {
        const u = getCurrentUser();
        if (u && u.role === "scout") await loadPlayers();
        else renderApp();
    })();
</script>
</body>
</html>
