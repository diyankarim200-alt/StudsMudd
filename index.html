<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Studs Mudd | Cross-Device Scouting Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #1a0000 0%, #000000 100%);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .studs-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(8, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            border-radius: 2rem;
            border: 1px solid #dc2626;
            box-shadow: 0 20px 40px rgba(220, 38, 38, 0.3);
            overflow: hidden;
        }

        .header {
            background: #0c0000;
            padding: 1rem 2rem;
            border-bottom: 3px solid #dc2626;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d4d, #b91c1c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        .logo p {
            color: #b77;
            font-size: 0.7rem;
        }
        .user-panel {
            background: #1f0808;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid #dc2626;
        }
        .user-greeting {
            color: #ffc0c0;
            font-weight: 600;
        }
        .role-badge {
            background: #b91c1c;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .logout-btn {
            background: none;
            border: 1px solid #dc5e5e;
            color: #ffb3b3;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: #dc2626;
            color: black;
        }
        .dashboard {
            padding: 2rem;
            min-height: 500px;
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .player-card {
            background: #0f0303;
            border-radius: 1.2rem;
            border: 1px solid #b22222;
            padding: 1.2rem;
            transition: 0.2s;
        }
        .player-card:hover {
            border-color: #ff4d4d;
            transform: translateY(-3px);
        }
        .player-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff8a8a;
            border-left: 4px solid #dc2626;
            padding-left: 0.6rem;
            margin-bottom: 0.5rem;
        }
        .player-detail {
            color: #d4b0b0;
            font-size: 0.85rem;
            margin: 0.4rem 0;
        }
        .contact-info {
            background: #1e0a0a;
            padding: 0.7rem;
            border-radius: 0.8rem;
            margin: 0.6rem 0;
            border: 1px solid #9e2a2a;
        }
        .contact-label {
            color: #ff9999;
            font-weight: bold;
        }
        .scout-tag {
            display: inline-block;
            background: #5e1a1a;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 0.4rem;
        }
        .form-card {
            background: #0f0303;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #b91c1c;
            max-width: 600px;
            margin-bottom: 2rem;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 1.2rem;
            border-left: 5px solid #dc2626;
            padding-left: 0.8rem;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            color: #e6b3b3;
            margin-bottom: 0.3rem;
            font-weight: 500;
            font-size: 0.85rem;
        }
        input, select, textarea {
            width: 100%;
            background: #1f0c0c;
            border: 1px solid #a53b3b;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            color: #fff0f0;
            font-size: 0.9rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff4d4d;
            box-shadow: 0 0 4px red;
        }
        button {
            background: #b91c1c;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.3rem;
        }
        button:hover {
            background: #dc2626;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #dc2626;
            color: #ffa2a2;
        }
        .btn-outline:hover {
            background: #dc2626;
            color: black;
        }
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .auth-modal {
            background: #0a0101;
            border: 2px solid #dc2626;
            border-radius: 2rem;
            width: 92%;
            max-width: 480px;
            padding: 2rem;
            box-shadow: 0 0 30px rgba(220,38,38,0.5);
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #dc2626;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            background: none;
            color: #dd9898;
            border-radius: 0;
            margin-top: 0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }
        .auth-tab.active {
            color: #ff5e5e;
            border-bottom: 2px solid #dc2626;
        }
        .error-msg {
            background: #3e1212;
            padding: 0.5rem;
            border-radius: 1rem;
            color: #ffa0a0;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        hr {
            border-color: #dc2626;
            margin: 1rem 0;
        }
        .empty-state {
            text-align: center;
            color: #aa6f6f;
            padding: 3rem;
        }
        .sync-badge {
            display: inline-block;
            background: #2e0e0e;
            color: #ff9696;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-left: 0.5rem;
        }
        @media (max-width: 700px) {
            .dashboard { padding: 1rem; }
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="studs-container" id="appRoot"></div>

<script>
    // ==================== STUDS MUDD - CROSS DEVICE SYNC FIX ====================
    // PROBLEM FIX: When a player signs up on Device B, the scout on Device A must see them immediately.
    // SOLUTION: Using localStorage with 'storage' event + forcing re-render on every auth change.
    // All data is shared via localStorage - works across tabs and devices (same origin).
    
    // STORAGE KEYS
    const STORAGE_USERS = "studsmudd_users_cross";
    const STORAGE_PLAYER_PROFILES = "studsmudd_players_cross";
    
    // ---------- FORCE SYNC: custom event + storage event listener ----------
    function triggerGlobalSync() {
        // Manually dispatch a storage event to ensure all tabs detect changes
        window.dispatchEvent(new Event('storage'));
        // Also dispatch custom event for same-tab reactivity
        window.dispatchEvent(new CustomEvent('studsSync'));
    }
    
    // ---------- INITIALIZE DEFAULT DATA (only if empty) ----------
    function initData() {
        let changed = false;
        if (!localStorage.getItem(STORAGE_USERS)) {
            const defaultUsers = [
                { id: "scout_demo_1", username: "talent_scout", password: "redscout", role: "scout" },
                { id: "player_demo_1", username: "mbappe_star", password: "player123", role: "player" }
            ];
            localStorage.setItem(STORAGE_USERS, JSON.stringify(defaultUsers));
            changed = true;
        }
        
        if (!localStorage.getItem(STORAGE_PLAYER_PROFILES)) {
            const defaultProfiles = [
                { 
                    userId: "player_demo_1", 
                    fullName: "Kylian Mbappé", 
                    position: "Forward / LW", 
                    club: "Real Madrid",
                    age: "24",
                    contactEmail: "kylian.m@proagent.com",
                    contactPhone: "+33 6 12 34 56 78",
                    bio: "Explosive pace, clinical finisher, big game mentality."
                }
            ];
            localStorage.setItem(STORAGE_PLAYER_PROFILES, JSON.stringify(defaultProfiles));
            changed = true;
        }
        
        if (changed) triggerGlobalSync();
    }
    
    // Session management
    const SESSION_USER = "studsmudd_current_user";
    
    function getCurrentUser() {
        const raw = sessionStorage.getItem(SESSION_USER);
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }
    
    function setCurrentUser(user) {
        if (user) {
            sessionStorage.setItem(SESSION_USER, JSON.stringify(user));
        } else {
            sessionStorage.removeItem(SESSION_USER);
        }
        renderApp();
    }
    
    // ---------- AUTHENTICATION (IMMEDIATE SYNC) ----------
    function signUp(username, password, role) {
        const users = JSON.parse(localStorage.getItem(STORAGE_USERS));
        if (users.find(u => u.username === username)) {
            return { success: false, error: "❌ Username already taken. Choose another." };
        }
        if (password.length < 3) {
            return { success: false, error: "Password must be at least 3 characters." };
        }
        const newId = role === "scout" 
            ? `scout_${Date.now()}_${Math.random().toString(36).substr(2, 6)}` 
            : `player_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
        const newUser = { id: newId, username: username, password: password, role: role };
        users.push(newUser);
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
        
        // If player, create empty profile (they will fill contact info)
        if (role === "player") {
            let profiles = JSON.parse(localStorage.getItem(STORAGE_PLAYER_PROFILES));
            profiles.push({
                userId: newId,
                fullName: username,
                position: "Not specified",
                club: "Free Agent",
                age: "--",
                contactEmail: "",
                contactPhone: "",
                bio: "New player on the platform. Update your contact info so scouts can reach you!"
            });
            localStorage.setItem(STORAGE_PLAYER_PROFILES, JSON.stringify(profiles));
        }
        
        // CRITICAL: Force sync to all devices immediately
        triggerGlobalSync();
        
        // Auto-login after signup
        setCurrentUser({ id: newUser.id, username: newUser.username, role: newUser.role });
        return { success: true };
    }
    
    function login(username, password) {
        const users = JSON.parse(localStorage.getItem(STORAGE_USERS));
        const found = users.find(u => u.username === username && u.password === password);
        if (!found) return { success: false, error: "❌ Invalid username or password." };
        setCurrentUser({ id: found.id, username: found.username, role: found.role });
        return { success: true };
    }
    
    function logout() {
        setCurrentUser(null);
    }
    
    // ---------- PLAYER PROFILES (always fetch fresh from localStorage) ----------
    function getAllPlayerProfiles() {
        const users = JSON.parse(localStorage.getItem(STORAGE_USERS));
        const players = users.filter(u => u.role === "player");
        const profiles = JSON.parse(localStorage.getItem(STORAGE_PLAYER_PROFILES));
        
        const enriched = players.map(player => {
            const profile = profiles.find(p => p.userId === player.id);
            if (profile) {
                return {
                    userId: player.id,
                    username: player.username,
                    ...profile
                };
            } else {
                // Fallback if profile missing (should not happen)
                return {
                    userId: player.id,
                    username: player.username,
                    fullName: player.username,
                    position: "Unknown",
                    club: "Unknown",
                    age: "--",
                    contactEmail: "Not provided",
                    contactPhone: "Not provided",
                    bio: "No bio yet."
                };
            }
        });
        return enriched;
    }
    
    function getMyPlayerProfile(userId) {
        const profiles = JSON.parse(localStorage.getItem(STORAGE_PLAYER_PROFILES));
        return profiles.find(p => p.userId === userId) || null;
    }
    
    function updatePlayerProfile(userId, updatedData) {
        let profiles = JSON.parse(localStorage.getItem(STORAGE_PLAYER_PROFILES));
        const index = profiles.findIndex(p => p.userId === userId);
        if (index !== -1) {
            profiles[index] = { ...profiles[index], ...updatedData };
            localStorage.setItem(STORAGE_PLAYER_PROFILES, JSON.stringify(profiles));
            triggerGlobalSync(); // Immediately sync to all devices
            return true;
        }
        return false;
    }
    
    // ---------- CROSS-DEVICE SYNC: Storage event listener ----------
    function setupCrossDeviceSync() {
        // Listen for storage events from other tabs/devices
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_USERS || e.key === STORAGE_PLAYER_PROFILES) {
                console.log("🔄 Cross-device change detected, re-rendering...");
                renderApp();
            }
        });
        
        // Custom event for same-tab updates
        window.addEventListener('studsSync', () => {
            renderApp();
        });
        
        // Also re-render when page becomes visible again (user switches tab)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                renderApp();
            }
        });
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // ---------- RENDER LOGIC ----------
    let authModalActive = false;
    let authTab = "login";
    let authErrorMsg = "";
    let signupRole = "player";
    
    function showAuthModal(initialTab = "login", error = "") {
        authModalActive = true;
        authTab = initialTab;
        authErrorMsg = error;
        signupRole = "player";
        renderApp();
    }
    
    function closeAuthModal() {
        authModalActive = false;
        authErrorMsg = "";
        renderApp();
    }
    
    function handleLoginSubmit(uname, pwd) {
        if (!uname.trim() || !pwd.trim()) {
            showAuthModal("login", "Please fill both fields.");
            return;
        }
        const res = login(uname, pwd);
        if (!res.success) {
            showAuthModal("login", res.error);
        } else {
            closeAuthModal();
        }
    }
    
    function handleSignupSubmit(username, password, role) {
        if (!username.trim() || !password.trim()) {
            showAuthModal("signup", "Username and password required.");
            return;
        }
        const res = signUp(username, password, role);
        if (!res.success) {
            showAuthModal("signup", res.error);
        } else {
            closeAuthModal();
        }
    }
    
    // Main render
    function renderApp() {
        const root = document.getElementById("appRoot");
        const currentUser = getCurrentUser();
        
        // NOT LOGGED IN
        if (!currentUser) {
            root.innerHTML = `
                <div class="header">
                    <div class="logo">
                        <h1>◉ STUD$ MUDD ◉</h1>
                        <p>scout · discover · connect — cross-device network</p>
                    </div>
                    <button id="openAuthBtn" style="background:#b91c1c;">⚡ ENTER PLATFORM</button>
                </div>
                <div class="dashboard" style="text-align:center; padding: 3rem;">
                    <div style="background:#0f0303; border-radius:2rem; padding:2rem; max-width:650px; margin:0 auto;">
                        <h2 style="color:#dc2626;">⚽ Cross-Device Scouting Network</h2>
                        <p style="margin:1rem 0; color:#cd9f9f;">🔴 <strong>Players</strong> — provide your contact info (email & phone) to get discovered.<br>
                        🔵 <strong>Scouts</strong> — browse player profiles and see full contact details.</p>
                        <div style="background:#2e0a0a; border-radius:1rem; padding:0.8rem; margin:1rem 0;">
                            <p style="color:#ffbb77;">✅ <strong>Works across ALL devices</strong> — sign up on your phone, see it instantly on your laptop!</p>
                            <p style="color:#b77; font-size:0.75rem;">🔄 Real-time sync via localStorage | No backend required</p>
                        </div>
                        <button id="joinNowBtn" class="btn-outline" style="margin-top:1rem;">+ Sign up as Player / Scout</button>
                    </div>
                </div>
            `;
            const authBtn = document.getElementById("openAuthBtn");
            if (authBtn) authBtn.onclick = () => showAuthModal("login", "");
            const joinBtn = document.getElementById("joinNowBtn");
            if (joinBtn) joinBtn.onclick = () => showAuthModal("signup", "");
            if (authModalActive) renderAuthModalOverlay();
            return;
        }
        
        // LOGGED IN
        const isScout = currentUser.role === "scout";
        const isPlayer = currentUser.role === "player";
        
        if (isScout) {
            // SCOUT DASHBOARD: fetch players directly from localStorage (always fresh)
            const playersList = getAllPlayerProfiles();
            const playerCount = playersList.length;
            
            root.innerHTML = `
                <div class="header">
                    <div class="logo">
                        <h1>🔍 STUD$ MUDD · SCOUT MODE</h1>
                        <p>live talent pool | contacts visible</p>
                    </div>
                    <div class="user-panel">
                        <span class="user-greeting">👁️ ${escapeHtml(currentUser.username)}</span>
                        <span class="role-badge">SCOUT</span>
                        <span class="sync-badge">🔄 live sync</span>
                        <button id="logoutBtn" class="logout-btn">LEAVE</button>
                    </div>
                </div>
                <div class="dashboard">
                    <div class="section-title">📋 PLAYER DIRECTORY (${playerCount} players) <span style="font-size:0.8rem;">⚡ auto-refreshes across devices</span></div>
                    <div class="players-grid" id="playersGrid">
                        ${playersList.map(player => `
                            <div class="player-card">
                                <div class="player-name">⚡ ${escapeHtml(player.fullName || player.username)}</div>
                                <div class="player-detail"><strong>🎯 Position:</strong> ${escapeHtml(player.position)}</div>
                                <div class="player-detail"><strong>🏟️ Club:</strong> ${escapeHtml(player.club)}</div>
                                <div class="player-detail"><strong>📅 Age:</strong> ${escapeHtml(player.age)}</div>
                                <div class="contact-info">
                                    <div><span class="contact-label">📧 Email:</span> ${player.contactEmail ? escapeHtml(player.contactEmail) : '<span style="color:#aa6f6f;">Not provided yet</span>'}</div>
                                    <div><span class="contact-label">📞 Phone:</span> ${player.contactPhone ? escapeHtml(player.contactPhone) : '<span style="color:#aa6f6f;">Not provided yet</span>'}</div>
                                </div>
                                <div class="player-detail"><strong>📝 Bio:</strong> ${escapeHtml(player.bio?.substring(0, 120) || "No bio")}</div>
                                <div class="scout-tag">🔴 scout access | full contact visible</div>
                            </div>
                        `).join('')}
                        ${playersList.length === 0 ? '<div class="empty-state">✨ No players registered yet. Tell players to sign up! New players appear instantly here.</div>' : ''}
                    </div>
                    <div style="margin-top: 1.5rem; font-size:0.75rem; color:#aa6f6f; text-align:center; border-top: 1px solid #5e2a2a; padding-top:1rem;">
                        🔄 <strong>Cross-device active</strong> — When a player signs up on another device, they appear here automatically.
                        <br>💡 Test: Open this page in another browser tab, sign up as a new player, then come back here and refresh (or just wait 1 second — auto updates!)
                    </div>
                </div>
            `;
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
            
            // Set up auto-refresh timer for extra reliability (poll every 2 seconds)
            if (window._syncInterval) clearInterval(window._syncInterval);
            window._syncInterval = setInterval(() => {
                // Only refresh if we are still logged in as scout
                const stillScout = getCurrentUser()?.role === "scout";
                if (stillScout) {
                    renderApp();
                } else {
                    clearInterval(window._syncInterval);
                }
            }, 2000);
        } 
        else if (isPlayer) {
            // Clear any scout interval
            if (window._syncInterval) clearInterval(window._syncInterval);
            
            // PLAYER DASHBOARD
            let myProfile = getMyPlayerProfile(currentUser.id);
            if (!myProfile) {
                // emergency create
                let profiles = JSON.parse(localStorage.getItem(STORAGE_PLAYER_PROFILES));
                const newProfile = { userId: currentUser.id, fullName: currentUser.username, position: "Attacker", club: "Free Agent", age: "18", contactEmail: "", contactPhone: "", bio: "Update your info so scouts can contact you!" };
                profiles.push(newProfile);
                localStorage.setItem(STORAGE_PLAYER_PROFILES, JSON.stringify(profiles));
                myProfile = newProfile;
                triggerGlobalSync();
            }
            
            root.innerHTML = `
                <div class="header">
                    <div class="logo">
                        <h1>⭐ STUD$ MUDD · PLAYER ZONE</h1>
                        <p>provide contact info to get scouted</p>
                    </div>
                    <div class="user-panel">
                        <span class="user-greeting">🎮 ${escapeHtml(currentUser.username)}</span>
                        <span class="role-badge">PLAYER</span>
                        <span class="sync-badge">🔄 live sync</span>
                        <button id="logoutBtn" class="logout-btn">EXIT</button>
                    </div>
                </div>
                <div class="dashboard">
                    <div class="form-card">
                        <div class="section-title">📝 YOUR PROFILE (CONTACT INFO = VISIBLE TO SCOUTS)</div>
                        <p style="color:#ffbb77; margin-bottom: 1rem; background:#2a0a0a; padding:0.5rem; border-radius:1rem;">🔴 <strong>Important:</strong> Scouts will see your email and phone number instantly across all devices.</p>
                        <div class="input-group">
                            <label>Full Name (visible)</label>
                            <input type="text" id="fullName" value="${escapeHtml(myProfile.fullName || '')}" placeholder="Your real name">
                        </div>
                        <div class="input-group">
                            <label>Position</label>
                            <input type="text" id="position" value="${escapeHtml(myProfile.position || '')}" placeholder="e.g., Striker, Midfielder">
                        </div>
                        <div class="input-group">
                            <label>Current Club / Team</label>
                            <input type="text" id="club" value="${escapeHtml(myProfile.club || '')}" placeholder="Club name">
                        </div>
                        <div class="input-group">
                            <label>Age</label>
                            <input type="text" id="age" value="${escapeHtml(myProfile.age || '')}" placeholder="e.g., 19">
                        </div>
                        <div class="input-group">
                            <label>📧 Contact Email (scouts will see this)</label>
                            <input type="email" id="contactEmail" value="${escapeHtml(myProfile.contactEmail || '')}" placeholder="your@email.com">
                        </div>
                        <div class="input-group">
                            <label>📞 Contact Phone (scouts will see this)</label>
                            <input type="text" id="contactPhone" value="${escapeHtml(myProfile.contactPhone || '')}" placeholder="+1234567890">
                        </div>
                        <div class="input-group">
                            <label>Bio / Highlights (strengths, achievements)</label>
                            <textarea id="bio" rows="3" placeholder="Tell scouts about your skills, stats, and ambitions...">${escapeHtml(myProfile.bio || '')}</textarea>
                        </div>
                        <button id="saveProfileBtn">💾 SAVE PROFILE (SYNC TO ALL DEVICES)</button>
                        <hr>
                        <div style="background:#1e0a0a; border-radius:1rem; padding:0.8rem; margin-top:1rem;">
                            <p style="color:#ffb3b3;"><strong>👀 What scouts see:</strong></p>
                            <div style="font-size:0.85rem; color:#c08f8f;">Your full name, position, club, age, <strong>email & phone</strong>, and bio. All contact info is visible to every scout on the platform.</div>
                            <div style="font-size:0.75rem; color:#aa7a7a; margin-top:0.5rem;">✅ Changes appear instantly across all logged-in devices. Scouts will see updates without refreshing.</div>
                        </div>
                    </div>
                </div>
            `;
            const saveBtn = document.getElementById("saveProfileBtn");
            if (saveBtn) {
                saveBtn.onclick = () => {
                    const updated = {
                        fullName: document.getElementById("fullName").value,
                        position: document.getElementById("position").value,
                        club: document.getElementById("club").value,
                        age: document.getElementById("age").value,
                        contactEmail: document.getElementById("contactEmail").value,
                        contactPhone: document.getElementById("contactPhone").value,
                        bio: document.getElementById("bio").value
                    };
                    updatePlayerProfile(currentUser.id, updated);
                    alert("✅ Profile updated! Scouts will see your new contact info instantly across all devices.");
                    renderApp();
                };
            }
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
        }
        
        if (authModalActive && !getCurrentUser()) {
            renderAuthModalOverlay();
        }
    }
    
    function renderAuthModalOverlay() {
        const existing = document.getElementById("studsAuthModal");
        if (existing) existing.remove();
        const root = document.getElementById("appRoot");
        if (!root) return;
        const modalDiv = document.createElement("div");
        modalDiv.id = "studsAuthModal";
        modalDiv.className = "auth-overlay";
        
        modalDiv.innerHTML = `
            <div class="auth-modal">
                <div class="auth-tabs">
                    <button id="authTabLogin" class="auth-tab ${authTab === 'login' ? 'active' : ''}">LOGIN</button>
                    <button id="authTabSignup" class="auth-tab ${authTab === 'signup' ? 'active' : ''}">SIGN UP</button>
                </div>
                ${authErrorMsg ? `<div class="error-msg">⚠️ ${escapeHtml(authErrorMsg)}</div>` : ""}
                <div id="authFormContainer"></div>
                <div style="margin-top:1rem; text-align:center;">
                    <button id="closeAuthModalBtn" class="btn-outline" style="background:#2c0a0a;">Cancel</button>
                </div>
            </div>
        `;
        root.appendChild(modalDiv);
        
        const loginTab = document.getElementById("authTabLogin");
        const signupTab = document.getElementById("authTabSignup");
        const formContainer = document.getElementById("authFormContainer");
        const closeBtn = document.getElementById("closeAuthModalBtn");
        
        const renderForm = () => {
            if (authTab === "login") {
                formContainer.innerHTML = `
                    <div class="input-group"><label>Username</label><input id="loginUser" type="text" placeholder="scout or player username"></div>
                    <div class="input-group"><label>Password</label><input id="loginPass" type="password" placeholder="password"></div>
                    <button id="doLoginBtn">ENTER PITCH ⚡</button>
                    <p style="color:#aa6f6f; font-size:0.7rem; text-align:center; margin-top:0.8rem;">Demo: talent_scout / redscout | mbappe_star / player123</p>
                `;
                const doLogin = document.getElementById("doLoginBtn");
                if (doLogin) doLogin.onclick = () => {
                    const uname = document.getElementById("loginUser").value;
                    const pwd = document.getElementById("loginPass").value;
                    handleLoginSubmit(uname, pwd);
                };
            } else {
                formContainer.innerHTML = `
                    <div class="input-group"><label>Username *</label><input id="signUser" type="text" placeholder="choose username"></div>
                    <div class="input-group"><label>Password * (min 3 chars)</label><input id="signPass" type="password" placeholder="password"></div>
                    <div class="input-group"><label>I want to sign up as:</label>
                        <select id="signRole">
                            <option value="player" ${signupRole === 'player' ? 'selected' : ''}>⚽ Player (I will provide contact info for scouts)</option>
                            <option value="scout" ${signupRole === 'scout' ? 'selected' : ''}>🔎 Scout (I can view players & contact them)</option>
                        </select>
                    </div>
                    <button id="doSignupBtn">CREATE ACCOUNT & JOIN</button>
                    <p style="color:#c07a7a; font-size:0.7rem; text-align:center; margin-top:0.8rem;">✅ After signup, your account works on ANY device. Scouts will see you immediately!</p>
                `;
                const roleSelect = document.getElementById("signRole");
                if (roleSelect) {
                    roleSelect.addEventListener("change", (e) => { signupRole = e.target.value; });
                }
                const doSign = document.getElementById("doSignupBtn");
                if (doSign) doSign.onclick = () => {
                    const uname = document.getElementById("signUser").value;
                    const pwd = document.getElementById("signPass").value;
                    const role = document.getElementById("signRole").value;
                    handleSignupSubmit(uname, pwd, role);
                };
            }
        };
        
        if (loginTab) loginTab.onclick = () => { authTab = "login"; authErrorMsg = ""; renderAuthModalOverlay(); };
        if (signupTab) signupTab.onclick = () => { authTab = "signup"; authErrorMsg = ""; signupRole = "player"; renderAuthModalOverlay(); };
        if (closeBtn) closeBtn.onclick = () => closeAuthModal();
        
        renderForm();
    }
    
    // Bootstrap
    initData();
    setupCrossDeviceSync();
    renderApp();
</script>
</body>
</html>
