<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Studs Mudd | Unified Scouting Network</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 25% 0%, #0a0000 0%, #000000 100%);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
        }

        /* animated background grain */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDMiLz48L3N2Zz4=');
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
        }

        .studs-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(6, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            border: 1px solid rgba(220, 38, 38, 0.4);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(220, 38, 38, 0.1) inset;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .header {
            background: rgba(12, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(220, 38, 38, 0.6);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d4d, #b91c1c, #7f1a1a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 8px rgba(220, 38, 38, 0.3);
        }

        .logo p {
            color: #b77;
            font-size: 0.7rem;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .user-panel {
            background: rgba(31, 8, 8, 0.9);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1.2rem;
            border-radius: 80px;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid #dc2626;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .user-greeting {
            color: #ffc0c0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .role-badge {
            background: linear-gradient(145deg, #b91c1c, #7f1a1a);
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: white;
            text-transform: uppercase;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 2px black;
        }

        .logout-btn, .btn-outline {
            background: none;
            border: 1px solid #dc5e5e;
            color: #ffb3b3;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .logout-btn:hover, .btn-outline:hover {
            background: #dc2626;
            color: black;
            border-color: white;
            transform: scale(0.96);
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);
        }

        /* Dashboard */
        .dashboard {
            padding: 2rem;
            min-height: 500px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(120deg, #ff6b6b, #dc2626);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
            border-left: 5px solid #dc2626;
            padding-left: 1rem;
            letter-spacing: -0.3px;
        }

        /* Players grid */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        .player-card {
            background: rgba(15, 3, 3, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 1.8rem;
            border: 1px solid rgba(180, 34, 34, 0.5);
            padding: 1.3rem;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.5);
        }

        .player-card:hover {
            border-color: #ff4d4d;
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(220, 38, 38, 0.3);
            background: rgba(20, 5, 5, 0.9);
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ff8a8a;
            border-left: 4px solid #dc2626;
            padding-left: 0.75rem;
            margin-bottom: 0.75rem;
            letter-spacing: -0.3px;
        }

        .player-detail {
            color: #d4b0b0;
            font-size: 0.85rem;
            margin: 0.5rem 0;
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .contact-info {
            background: rgba(30, 10, 10, 0.7);
            padding: 0.8rem;
            border-radius: 1rem;
            margin: 0.8rem 0;
            border: 1px solid #9e2a2a;
            font-size: 0.8rem;
        }

        .contact-label {
            color: #ffacac;
            font-weight: 700;
            margin-right: 0.4rem;
        }

        .scout-tag {
            display: inline-block;
            background: linear-gradient(145deg, #5e1a1a, #3e0a0a);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 0.5rem;
            color: #ffc0c0;
        }

        /* Form styling */
        .form-card {
            background: rgba(12, 2, 2, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1.8rem;
            border: 1px solid #b91c1c;
            max-width: 620px;
            margin-bottom: 1rem;
            transition: 0.2s;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            color: #f0c0c0;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }

        input, select, textarea {
            width: 100%;
            background: #1f0c0c;
            border: 1px solid #a53b3b;
            padding: 0.75rem 1rem;
            border-radius: 1.2rem;
            color: #fff0f0;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff4d4d;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.3);
            background: #2c0f0f;
        }

        button {
            background: linear-gradient(145deg, #b91c1c, #8b1515);
            border: none;
            padding: 0.75rem 1.8rem;
            border-radius: 2rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.3rem;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(145deg, #dc2626, #a51c1c);
            transform: scale(0.97);
            box-shadow: 0 6px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #dc2626;
            box-shadow: none;
        }

        /* Auth modal */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-modal {
            background: #0a0101;
            border: 2px solid #dc2626;
            border-radius: 2.2rem;
            width: 92%;
            max-width: 480px;
            padding: 2rem;
            box-shadow: 0 30px 40px rgba(220, 38, 38, 0.3);
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #dc2626;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            background: none;
            color: #dd9898;
            border-radius: 0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .auth-tab.active {
            color: #ff5e5e;
            border-bottom: 2px solid #dc2626;
        }

        .error-msg {
            background: #3e1212;
            padding: 0.6rem;
            border-radius: 1rem;
            color: #ffa0a0;
            font-size: 0.8rem;
            margin-bottom: 1.2rem;
            text-align: center;
            border-left: 3px solid #ff4d4d;
        }

        /* Status area */
        .status-area {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0a0101cc;
            backdrop-filter: blur(12px);
            border: 1px solid #dc2626;
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            font-size: 0.75rem;
            color: #ffb3b3;
            z-index: 1000;
            font-family: monospace;
            font-weight: 500;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px black;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #3eff6e;
            margin-right: 8px;
            box-shadow: 0 0 6px #3eff6e;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #ff9999;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .empty-state {
            text-align: center;
            color: #bb7a7a;
            padding: 3rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2rem;
            font-style: italic;
        }

        hr {
            border-color: #dc2626;
            margin: 1rem 0;
        }

        /* responsiveness */
        @media (max-width: 700px) {
            body { padding: 0.8rem; }
            .dashboard { padding: 1rem; }
            .header { flex-direction: column; text-align: center; padding: 1rem; }
            .section-title { font-size: 1.3rem; }
            .players-grid { gap: 1rem; }
        }
    </style>
</head>
<body>
<div class="studs-container" id="appRoot"></div>
<div class="status-area" id="globalStatus"><span class="live-dot"></span> System ready</div>

<script>
    // ========== YOUR DEPLOYED GOOGLE APPS SCRIPT URL ==========
    const API_URL = "YOUR_DEPLOYED_URL_HERE";  // <-- PASTE YOUR URL HERE
    
    // Helper: show temporary status
    function setStatus(msg, isError = false) {
        const el = document.getElementById("globalStatus");
        if (el) {
            el.innerHTML = msg;
            el.style.background = isError ? "#3e1212cc" : "#0a3a1acc";
            setTimeout(() => {
                if (document.getElementById("globalStatus"))
                    document.getElementById("globalStatus").innerHTML = '<span class="live-dot"></span> System ready';
            }, 2500);
        }
    }
    
    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    
    // ========== BACKEND COMMUNICATION ==========
    async function apiCall(action, payload) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            const data = await response.json();
            return data;
        } catch (err) {
            console.error(err);
            return { success: false, message: "Network error" };
        }
    }
    
    async function fetchPlayers() {
        try {
            const response = await fetch(API_URL, { method: 'GET', mode: 'cors' });
            const data = await response.json();
            if (data.success) return data.players;
            else return [];
        } catch (err) {
            console.error(err);
            setStatus("Could not load players", true);
            return [];
        }
    }
    
    // ========== AUTHENTICATION (server‑side) ==========
    async function signup(username, password, role) {
        if (password.length < 3) return { success: false, error: "Password must be at least 3 characters" };
        const userId = (role === "scout" ? "scout_" : "player_") + Date.now() + "_" + Math.random().toString(36).substr(2,6);
        const result = await apiCall("signup", {
            userId, username, password, role,
            fullName: username, position: "", club: "", age: "", contactEmail: "", contactPhone: "", bio: ""
        });
        if (result.success) {
            sessionStorage.setItem("currentUser", JSON.stringify({ id: userId, username, role }));
            return { success: true };
        } else {
            return { success: false, error: result.message };
        }
    }
    
    async function login(username, password) {
        const result = await apiCall("login", { username, password });
        if (result.success) {
            sessionStorage.setItem("currentUser", JSON.stringify({
                id: result.userId,
                username: result.username,
                role: result.role
            }));
            return { success: true };
        } else {
            return { success: false, error: result.message };
        }
    }
    
    function getCurrentUser() {
        const raw = sessionStorage.getItem("currentUser");
        return raw ? JSON.parse(raw) : null;
    }
    
    function logout() {
        sessionStorage.removeItem("currentUser");
        window.location.reload();
    }
    
    // ========== PLAYER PROFILE UPDATE ==========
    async function updateProfile(userId, profile) {
        return await apiCall("update_profile", { userId, ...profile });
    }
    
    // ========== UI RENDERING ==========
    let authModalActive = false;
    let authTab = "login";
    let authError = "";
    let signupRole = "player";
    let currentPlayers = [];
    let isLoading = true;
    
    function showAuth(initialTab = "login", error = "") {
        authModalActive = true;
        authTab = initialTab;
        authError = error;
        signupRole = "player";
        renderApp();
    }
    
    function closeAuth() {
        authModalActive = false;
        authError = "";
        renderApp();
    }
    
    async function handleLogin(u, p) {
        if (!u.trim() || !p.trim()) { showAuth("login", "Fill both fields"); return; }
        const res = await login(u, p);
        if (res.success) {
            closeAuth();
            if (getCurrentUser().role === "scout") await loadPlayers();
            renderApp();
        } else {
            showAuth("login", res.error);
        }
    }
    
    async function handleSignup(u, p, role) {
        if (!u.trim() || !p.trim()) { showAuth("signup", "Fill all fields"); return; }
        const res = await signup(u, p, role);
        if (res.success) {
            closeAuth();
            if (role === "scout") await loadPlayers();
            renderApp();
        } else {
            showAuth("signup", res.error);
        }
    }
    
    async function loadPlayers() {
        isLoading = true;
        renderApp();
        currentPlayers = await fetchPlayers();
        isLoading = false;
        renderApp();
    }
    
    async function renderApp() {
        const root = document.getElementById("appRoot");
        const user = getCurrentUser();
        
        // Not logged in
        if (!user) {
            root.innerHTML = `
                <div class="header"><div class="logo"><h1>◉ STUD$ MUDD ◉</h1><p>central scouting network</p></div><button id="openAuthBtn" style="background:#b91c1c;">⚡ ENTER</button></div>
                <div class="dashboard" style="text-align:center; padding:3rem;"><div style="background:rgba(15,3,3,0.6); backdrop-filter:blur(8px); border-radius:2rem; padding:2rem; max-width:650px; margin:0 auto; border:1px solid #dc2626;">
                <h2 style="color:#dc2626; margin-bottom:0.5rem;">Unified Platform</h2><p style="margin:1rem 0;">All data is shared across every device. Sign up once, access everywhere.</p>
                <button id="joinBtn" class="btn-outline">Join Now</button></div></div>
            `;
            document.getElementById("openAuthBtn")?.addEventListener("click", () => showAuth("login"));
            document.getElementById("joinBtn")?.addEventListener("click", () => showAuth("signup"));
            if (authModalActive) renderAuthModal();
            return;
        }
        
        // SCOUT DASHBOARD
        if (user.role === "scout") {
            if (isLoading) {
                root.innerHTML = `<div class="header"><div class="logo"><h1>🔍 SCOUT MODE</h1></div><div class="user-panel"><span>${escapeHtml(user.username)}</span><button id="logoutBtn" class="logout-btn">EXIT</button></div></div><div class="loading">⟳ Loading directory...</div>`;
                document.getElementById("logoutBtn")?.addEventListener("click", logout);
                return;
            }
            root.innerHTML = `
                <div class="header"><div class="logo"><h1>🔍 STUD$ MUDD · SCOUT MODE</h1><p>${currentPlayers.length} active profiles</p></div>
                <div class="user-panel"><span class="user-greeting">👁️ ${escapeHtml(user.username)}</span><span class="role-badge">SCOUT</span><button id="logoutBtn" class="logout-btn">EXIT</button></div></div>
                <div class="dashboard"><div class="section-title">📋 PLAYER DIRECTORY</div><div class="players-grid">
                ${currentPlayers.map(p => `
                    <div class="player-card"><div class="player-name">⚡ ${escapeHtml(p.fullName)}</div>
                    <div class="player-detail"><strong>🎯 Position:</strong> ${escapeHtml(p.position)}</div>
                    <div class="player-detail"><strong>🏟️ Club:</strong> ${escapeHtml(p.club)}</div>
                    <div class="player-detail"><strong>📅 Age:</strong> ${escapeHtml(p.age)}</div>
                    <div class="contact-info"><div><span class="contact-label">📧 Email:</span> ${escapeHtml(p.contactEmail)}</div>
                    <div><span class="contact-label">📞 Phone:</span> ${escapeHtml(p.contactPhone)}</div></div>
                    <div class="player-detail"><strong>📝 Bio:</strong> ${escapeHtml(p.bio.substring(0,120))}</div>
                    <div class="scout-tag">Full contact visible</div></div>
                `).join('')}
                ${currentPlayers.length === 0 ? '<div class="empty-state">✨ No players yet. Share the platform to grow the directory.</div>' : ''}
                </div></div>
            `;
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
            return;
        }
        
        // PLAYER DASHBOARD
        if (user.role === "player") {
            root.innerHTML = `
                <div class="header"><div class="logo"><h1>⭐ PLAYER ZONE</h1><p>complete your profile</p></div>
                <div class="user-panel"><span>🎮 ${escapeHtml(user.username)}</span><span class="role-badge">PLAYER</span><button id="logoutBtn" class="logout-btn">EXIT</button></div></div>
                <div class="dashboard"><div class="form-card"><div class="section-title">📝 YOUR PROFILE</div>
                <div class="input-group"><label>Full Name *</label><input id="fullName" placeholder="Real name"></div>
                <div class="input-group"><label>Position</label><input id="position" placeholder="e.g., Striker"></div>
                <div class="input-group"><label>Club</label><input id="club" placeholder="Club name"></div>
                <div class="input-group"><label>Age</label><input id="age" placeholder="e.g., 21"></div>
                <div class="input-group"><label>📧 Contact Email (scouts see this)</label><input id="email" type="email" placeholder="your@email.com"></div>
                <div class="input-group"><label>📞 Contact Phone (scouts see this)</label><input id="phone" placeholder="+1234567890"></div>
                <div class="input-group"><label>Bio / Highlights</label><textarea id="bio" rows="3" placeholder="Tell scouts about your skills..."></textarea></div>
                <button id="saveBtn">💾 SAVE PROFILE</button>
                <hr><div style="background:rgba(30,10,10,0.6); border-radius:1rem; padding:0.8rem;"><p style="color:#ffb3b3;">✅ Your profile is instantly visible to all scouts.</p></div></div></div>
            `;
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
            document.getElementById("saveBtn")?.addEventListener("click", async () => {
                const profile = {
                    fullName: document.getElementById("fullName").value,
                    position: document.getElementById("position").value,
                    club: document.getElementById("club").value,
                    age: document.getElementById("age").value,
                    contactEmail: document.getElementById("email").value,
                    contactPhone: document.getElementById("phone").value,
                    bio: document.getElementById("bio").value
                };
                const res = await updateProfile(user.id, profile);
                if (res.success) {
                    setStatus("Profile saved!");
                    alert("✅ Your profile has been saved. Scouts can now see your information.");
                } else {
                    setStatus("Error saving profile", true);
                }
            });
        }
        
        if (authModalActive && !getCurrentUser()) renderAuthModal();
    }
    
    function renderAuthModal() {
        const existing = document.getElementById("authModal");
        if (existing) existing.remove();
        const root = document.getElementById("appRoot");
        if (!root) return;
        const modalDiv = document.createElement("div");
        modalDiv.id = "authModal";
        modalDiv.className = "auth-overlay";
        modalDiv.innerHTML = `
            <div class="auth-modal"><div class="auth-tabs"><button id="tabLogin" class="auth-tab ${authTab === 'login' ? 'active' : ''}">LOGIN</button><button id="tabSignup" class="auth-tab ${authTab === 'signup' ? 'active' : ''}">SIGN UP</button></div>
            ${authError ? `<div class="error-msg">⚠️ ${escapeHtml(authError)}</div>` : ""}
            <div id="authForm"></div><div style="margin-top:1rem; text-align:center;"><button id="closeModal" class="btn-outline">Cancel</button></div></div>
        `;
        root.appendChild(modalDiv);
        
        const renderForm = () => {
            const container = document.getElementById("authForm");
            if (authTab === "login") {
                container.innerHTML = `<div class="input-group"><label>Username</label><input id="loginUser" type="text"></div><div class="input-group"><label>Password</label><input id="loginPass" type="password"></div><button id="doLogin">ENTER ⚡</button><p style="color:#aa6f6f; font-size:0.7rem; margin-top:0.8rem;">Demo scout: talent_scout / redscout</p>`;
                document.getElementById("doLogin")?.addEventListener("click", () => {
                    const u = document.getElementById("loginUser").value;
                    const p = document.getElementById("loginPass").value;
                    handleLogin(u, p);
                });
            } else {
                container.innerHTML = `<div class="input-group"><label>Username *</label><input id="signUser" type="text"></div><div class="input-group"><label>Password * (min 3)</label><input id="signPass" type="password"></div><div class="input-group"><label>I am a:</label><select id="signRole"><option value="player">⚽ Player (Get discovered)</option><option value="scout">🔍 Scout (Discover talent)</option></select></div><button id="doSignup">CREATE ACCOUNT</button>`;
                document.getElementById("doSignup")?.addEventListener("click", () => {
                    const u = document.getElementById("signUser").value;
                    const p = document.getElementById("signPass").value;
                    const r = document.getElementById("signRole").value;
                    handleSignup(u, p, r);
                });
            }
        };
        
        document.getElementById("tabLogin")?.addEventListener("click", () => { authTab = "login"; authError = ""; renderAuthModal(); });
        document.getElementById("tabSignup")?.addEventListener("click", () => { authTab = "signup"; authError = ""; renderAuthModal(); });
        document.getElementById("closeModal")?.addEventListener("click", closeAuth);
        renderForm();
    }
    
    // Start the app: pre‑load players if a scout is already logged in
    (async () => {
        const u = getCurrentUser();
        if (u && u.role === "scout") await loadPlayers();
        else renderApp();
    })();
</script>
</body>
</html>
