<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Studs Mudd | Football Scouting Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0a0a, #000000);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      position: relative;
    }

    /* dynamic animated background overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, rgba(220, 20, 60, 0.02) 0px, rgba(220, 20, 60, 0.02) 2px, transparent 2px, transparent 8px);
      pointer-events: none;
      z-index: 0;
    }

    .glass-card {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid rgba(220, 38, 38, 0.5);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(220, 38, 38, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      z-index: 2;
      position: relative;
    }

    /* landing panel */
    .landing-panel {
      text-align: center;
      padding: 3rem 2rem;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    h1 {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF 0%, #E11D1D 70%, #FF4D4D 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 1rem;
      text-shadow: 0 2px 10px rgba(220, 38, 38, 0.3);
      animation: fadeSlideUp 0.8s ease-out;
    }

    .tagline {
      font-size: 1.25rem;
      color: #e0e0e0;
      border-left: 4px solid #E11D1D;
      padding-left: 1rem;
      display: inline-block;
      margin-bottom: 2.5rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.4);
      border-radius: 0 16px 16px 0;
      padding: 0.5rem 1.2rem;
      backdrop-filter: blur(4px);
      animation: fadeSlideUp 0.8s 0.1s both;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.8rem;
      margin-top: 1rem;
      animation: fadeSlideUp 0.8s 0.2s both;
    }

    .btn {
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(20, 20, 20, 0.9);
      color: white;
      border: 1px solid rgba(225, 29, 29, 0.6);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn-player {
      background: linear-gradient(95deg, #B91C1C, #7F1D1D);
      border: none;
      box-shadow: 0 5px 0 #4A0E0E;
    }

    .btn-scout {
      background: linear-gradient(95deg, #1F2937, #111827);
      border: 1px solid #E11D1D;
      box-shadow: 0 5px 0 #0F172A;
    }

    .btn:hover {
      transform: translateY(-5px);
      filter: brightness(1.05);
      box-shadow: 0 12px 25px rgba(225, 29, 29, 0.3);
    }

    .btn:active {
      transform: translateY(2px);
    }

    /* forms */
    .form-panel {
      max-width: 520px;
      margin: 2rem auto;
      padding: 2rem 2rem 2.2rem;
      transition: all 0.4s ease;
      animation: floatIn 0.5s ease;
    }

    .form-panel h2 {
      color: #E11D1D;
      font-size: 1.9rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .role-badge {
      background: #1f1f1f;
      padding: 0.2rem 1rem;
      border-radius: 60px;
      font-size: 0.9rem;
      color: #E11D1D;
      font-weight: 500;
      border-left: 2px solid #E11D1D;
    }

    .input-group {
      margin-bottom: 1.4rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #ddd;
      font-size: 0.9rem;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 0.9rem 1rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 1rem;
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
      outline: none;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: #E11D1D;
      box-shadow: 0 0 0 2px rgba(225, 29, 29, 0.3);
    }

    .error-msg {
      color: #ff5e5e;
      font-size: 0.75rem;
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .success-msg {
      color: #4ade80;
      background: #1a3a1a;
      padding: 0.6rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(90deg, #E11D1D, #B91C1C);
      margin-top: 0.7rem;
      padding: 0.9rem;
      font-weight: bold;
      border-radius: 2rem;
      border: none;
      color: white;
      font-size: 1.1rem;
      transition: 0.2s;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: linear-gradient(90deg, #ff2a2a, #d11919);
      transform: scale(1.01);
      box-shadow: 0 6px 14px rgba(225, 29, 29, 0.4);
    }

    .back-link {
      margin-top: 1.5rem;
      text-align: center;
    }

    .back-link button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .back-link button:hover {
      color: #E11D1D;
    }

    /* login section inside same flow */
    .login-switch {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #bbb;
    }

    .login-switch span {
      color: #E11D1D;
      cursor: pointer;
      font-weight: bold;
      text-decoration: underline;
      transition: 0.2s;
    }

    hr {
      margin: 1rem 0;
      border-color: #2c2c2c;
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatIn {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* responsive */
    @media (max-width: 680px) {
      h1 {
        font-size: 2.8rem;
      }
      .btn {
        padding: 0.7rem 1.8rem;
        font-size: 1rem;
      }
      .form-panel {
        padding: 1.5rem;
      }
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #5a5a5a;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Landing Page Section -->
  <div id="landingSection" class="glass-card landing-panel">
    <h1>⚽ STUDS MUDD</h1>
    <div class="tagline">⚡ Discover the raw gems. | Scout the future. | Where talent meets vision ⚡</div>
    <div class="button-group">
      <button id="playerSignupBtn" class="btn btn-player">✍️ Sign up as Player</button>
      <button id="scoutSignupBtn" class="btn btn-scout">🔍 Sign up as Scout</button>
    </div>
    <div class="login-switch" style="margin-top: 2rem;">
      <span id="showLoginBtn">🔐 Already have an account? Log in →</span>
    </div>
    <footer>© 2025 Studs Mudd — Elevate your football career</footer>
  </div>

  <!-- Signup Form Container (dynamically shown) -->
  <div id="signupContainer" class="hidden"></div>

  <!-- Login Form Container -->
  <div id="loginContainer" class="hidden"></div>
</div>

<script>
  // ======================== GOOGLE SHEETS WEB APP URL (UPDATED) ========================
  // Your personal Apps Script deployment URL
  const GS_API_URL = "https://script.google.com/macros/s/AKfycbxNf9VBJR6wbfs-amYo7oTakNFIUota46Rsm2ywftILTyPk8QkMCahpXzQtVLQ1C1WD/exec";
  
  let currentRoleForSignup = "Player"; // default

  const dom = {
    landing: document.getElementById('landingSection'),
    signupContainer: document.getElementById('signupContainer'),
    loginContainer: document.getElementById('loginContainer')
  };

  function hideAllContainers() {
    dom.landing.classList.add('hidden');
    dom.signupContainer.classList.add('hidden');
    dom.loginContainer.classList.add('hidden');
    dom.signupContainer.innerHTML = '';
    dom.loginContainer.innerHTML = '';
  }

  function showLanding() {
    hideAllContainers();
    dom.landing.classList.remove('hidden');
  }

  // build signup form with prefilled role
  function buildSignupForm(role) {
    currentRoleForSignup = role;
    const formHtml = `
      <div class="glass-card form-panel">
        <h2>⚡ SIGN UP <span class="role-badge">${role}</span></h2>
        <div id="signupMessage"></div>
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="signupUsername" placeholder="football_star123" autocomplete="off">
          <div class="error-msg" id="signupUsernameError"></div>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="••••••">
        </div>
        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirmPwd" placeholder="••••••">
          <div class="error-msg" id="signupPwdError"></div>
        </div>
        <input type="hidden" id="signupRole" value="${role}">
        <button id="submitSignupBtn" class="submit-btn">CREATE ACCOUNT →</button>
        <div class="back-link"><button id="backToLandingFromSignup">← Back</button></div>
      </div>
    `;
    dom.signupContainer.innerHTML = formHtml;
    dom.signupContainer.classList.remove('hidden');
    document.getElementById('submitSignupBtn').addEventListener('click', handleSignupSubmit);
    document.getElementById('backToLandingFromSignup').addEventListener('click', showLanding);
  }

  // login form
  function buildLoginForm() {
    const loginHtml = `
      <div class="glass-card form-panel">
        <h2>🔐 LOGIN <span class="role-badge">Studs Mudd</span></h2>
        <div id="loginMessage"></div>
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="your_username">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••">
        </div>
        <button id="submitLoginBtn" class="submit-btn">ENTER PITCH →</button>
        <div class="back-link"><button id="backToLandingFromLogin">← Back</button></div>
        <hr>
        <div class="login-switch">Don't have an account? <span id="switchToSignup">Sign up now</span></div>
      </div>
    `;
    dom.loginContainer.innerHTML = loginHtml;
    dom.loginContainer.classList.remove('hidden');
    document.getElementById('submitLoginBtn').addEventListener('click', handleLoginSubmit);
    document.getElementById('backToLandingFromLogin').addEventListener('click', showLanding);
    document.getElementById('switchToSignup').addEventListener('click', () => {
      buildSignupForm('Player');
    });
  }

  // Helper to show message
  function setSignupMessage(msg, isError = true) {
    const msgDiv = document.getElementById('signupMessage');
    if (msgDiv) {
      msgDiv.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${msg}</div>`;
    }
  }
  function setLoginMessage(msg, isError = true) {
    const msgDiv = document.getElementById('loginMessage');
    if (msgDiv) {
      msgDiv.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${msg}</div>`;
    }
  }

  // ---------- GOOGLE SHEETS SIGNUP ----------
  async function handleSignupSubmit() {
    const username = document.getElementById('signupUsername')?.value.trim();
    const password = document.getElementById('signupPassword')?.value;
    const confirm = document.getElementById('signupConfirmPwd')?.value;
    const role = document.getElementById('signupRole')?.value;

    // clear errors
    const usernameErrorDiv = document.getElementById('signupUsernameError');
    const pwdErrorDiv = document.getElementById('signupPwdError');
    if (usernameErrorDiv) usernameErrorDiv.innerText = '';
    if (pwdErrorDiv) pwdErrorDiv.innerText = '';

    let valid = true;
    if (!username) {
      if (usernameErrorDiv) usernameErrorDiv.innerText = '❌ Username cannot be empty';
      valid = false;
    }
    if (password !== confirm) {
      if (pwdErrorDiv) pwdErrorDiv.innerText = '❌ Passwords do not match';
      valid = false;
    }
    if (password && password.length < 4 && password !== '') {
      if (pwdErrorDiv) pwdErrorDiv.innerText = '❌ Password must be at least 4 characters';
      valid = false;
    }
    if (!valid) return;

    setSignupMessage('⏳ Registering with Google Sheets...', false);
    try {
      const response = await fetch(GS_API_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'signup', username, password, role })
      });
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      const data = await response.json();
      if (data.success === true || data.status === 'success') {
        setSignupMessage(`✅ Account created! Welcome ${username} (${role}). You can now log in.`, false);
        setTimeout(() => {
          showLanding();
        }, 1800);
      } else {
        setSignupMessage(`❌ Signup failed: ${data.message || 'Username already exists or server error'}`);
      }
    } catch (err) {
      console.error('Google Sheets signup error:', err);
      let errorMsg = err.message;
      if (errorMsg.includes('Failed to fetch') || errorMsg.includes('NetworkError')) {
        errorMsg = 'Network error — Please check that your Apps Script is deployed with "Anyone" access and CORS enabled.';
      }
      setSignupMessage(`⚠️ Google Sheets error: ${errorMsg}`);
    }
  }

  // ---------- GOOGLE SHEETS LOGIN ----------
  async function handleLoginSubmit() {
    const username = document.getElementById('loginUsername')?.value.trim();
    const password = document.getElementById('loginPassword')?.value;
    if (!username || !password) {
      setLoginMessage('Please fill username and password');
      return;
    }
    setLoginMessage('🔎 Verifying credentials via Google Sheets...', false);
    try {
      const response = await fetch(GS_API_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', username, password })
      });
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      const data = await response.json();
      if (data.success === true || data.status === 'success') {
        setLoginMessage(`✨ Welcome back ${username} (${data.role || 'member'})! Redirecting...`, false);
        setTimeout(() => {
          alert(`⚽ Welcome to Studs Mudd, ${username}!\nYour dashboard will be ready soon. (Login successful via Google Sheets)`);
          showLanding();
        }, 1200);
      } else {
        setLoginMessage(`❌ Login failed: ${data.message || 'Invalid username or password'}`);
      }
    } catch (err) {
      console.error('Google Sheets login error:', err);
      let errorMsg = err.message;
      if (errorMsg.includes('Failed to fetch') || errorMsg.includes('NetworkError')) {
        errorMsg = 'Network error — verify Apps Script deployment and internet connection.';
      }
      setLoginMessage(`⚠️ Google Sheets error: ${errorMsg}`);
    }
  }

  // attach landing buttons
  document.getElementById('playerSignupBtn').addEventListener('click', () => {
    hideAllContainers();
    buildSignupForm('Player');
  });
  document.getElementById('scoutSignupBtn').addEventListener('click', () => {
    hideAllContainers();
    buildSignupForm('Scout');
  });
  document.getElementById('showLoginBtn').addEventListener('click', () => {
    hideAllContainers();
    buildLoginForm();
  });
  
  // initial state: landing visible
  showLanding();

  // Optional: test endpoint availability on page load (no side effects)
  (async function testEndpoint() {
    try {
      const testResp = await fetch(GS_API_URL, { method: 'GET' });
      if (testResp.ok) {
        const testData = await testResp.json();
        console.log('✅ Google Sheets endpoint reachable:', testData);
      } else {
        console.warn('⚠️ Google Sheets endpoint returned status:', testResp.status);
      }
    } catch (err) {
      console.warn('⚠️ Google Sheets endpoint not reachable. Please confirm Apps Script is deployed with "Anyone" access.', err.message);
    }
  })();
</script>
</body>
</html>
