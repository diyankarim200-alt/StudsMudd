<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Studs Mudd | Working Cross-Device Scouting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #1a0000 0%, #000000 100%);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .studs-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(8, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            border-radius: 2rem;
            border: 1px solid #dc2626;
            box-shadow: 0 20px 40px rgba(220, 38, 38, 0.3);
            overflow: hidden;
        }

        .header {
            background: #0c0000;
            padding: 1rem 2rem;
            border-bottom: 3px solid #dc2626;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d4d, #b91c1c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        .logo p {
            color: #b77;
            font-size: 0.7rem;
        }
        .user-panel {
            background: #1f0808;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid #dc2626;
            flex-wrap: wrap;
        }
        .user-greeting {
            color: #ffc0c0;
            font-weight: 600;
        }
        .role-badge {
            background: #b91c1c;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .logout-btn, .refresh-btn {
            background: none;
            border: 1px solid #dc5e5e;
            color: #ffb3b3;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .logout-btn:hover, .refresh-btn:hover {
            background: #dc2626;
            color: black;
        }
        .refresh-btn {
            background: #2a0a0a;
            border-color: #ff8888;
        }
        .dashboard {
            padding: 2rem;
            min-height: 500px;
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .player-card {
            background: #0f0303;
            border-radius: 1.2rem;
            border: 1px solid #b22222;
            padding: 1.2rem;
            transition: 0.2s;
        }
        .player-card:hover {
            border-color: #ff4d4d;
            transform: translateY(-3px);
        }
        .player-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff8a8a;
            border-left: 4px solid #dc2626;
            padding-left: 0.6rem;
            margin-bottom: 0.5rem;
        }
        .player-detail {
            color: #d4b0b0;
            font-size: 0.85rem;
            margin: 0.4rem 0;
        }
        .contact-info {
            background: #1e0a0a;
            padding: 0.7rem;
            border-radius: 0.8rem;
            margin: 0.6rem 0;
            border: 1px solid #9e2a2a;
        }
        .contact-label {
            color: #ff9999;
            font-weight: bold;
        }
        .scout-tag {
            display: inline-block;
            background: #5e1a1a;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 0.4rem;
        }
        .form-card {
            background: #0f0303;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #b91c1c;
            max-width: 600px;
            margin-bottom: 2rem;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 1.2rem;
            border-left: 5px solid #dc2626;
            padding-left: 0.8rem;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            color: #e6b3b3;
            margin-bottom: 0.3rem;
            font-weight: 500;
            font-size: 0.85rem;
        }
        input, select, textarea {
            width: 100%;
            background: #1f0c0c;
            border: 1px solid #a53b3b;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            color: #fff0f0;
            font-size: 0.9rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff4d4d;
            box-shadow: 0 0 4px red;
        }
        button {
            background: #b91c1c;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.3rem;
        }
        button:hover {
            background: #dc2626;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #dc2626;
            color: #ffa2a2;
        }
        .btn-outline:hover {
            background: #dc2626;
            color: black;
        }
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .auth-modal {
            background: #0a0101;
            border: 2px solid #dc2626;
            border-radius: 2rem;
            width: 92%;
            max-width: 480px;
            padding: 2rem;
            box-shadow: 0 0 30px rgba(220,38,38,0.5);
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #dc2626;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            background: none;
            color: #dd9898;
            border-radius: 0;
            margin-top: 0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }
        .auth-tab.active {
            color: #ff5e5e;
            border-bottom: 2px solid #dc2626;
        }
        .error-msg {
            background: #3e1212;
            padding: 0.5rem;
            border-radius: 1rem;
            color: #ffa0a0;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .sync-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0a0101;
            border: 1px solid #dc2626;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: #ff9999;
            z-index: 1000;
            font-family: monospace;
        }
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #00ff00;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: #ff9999;
        }
        hr {
            border-color: #dc2626;
            margin: 1rem 0;
        }
        .empty-state {
            text-align: center;
            color: #aa6f6f;
            padding: 3rem;
        }
        @media (max-width: 700px) {
            .dashboard { padding: 1rem; }
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="studs-container" id="appRoot"></div>
<div class="sync-status" id="syncStatus">
    <span class="live-indicator"></span> System Ready
</div>

<script>
    // ========== YOUR GOOGLE SHEETS WEB APP URL ==========
    // !!! IMPORTANT: REPLACE THIS WITH YOUR ACTUAL DEPLOYED URL !!!
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw7sClfkxYR27eTuS4mrk3iZ1IPZzktXaP4eC7R5Pmish4Dij5at9_GPdOaMfFBni9u/exec";
    
    // Storage keys
    const STORAGE_USERS = "studsmudd_users_final";
    const STORAGE_PLAYERS_CACHE = "studsmudd_players_cache";
    
    // ========== FIXED: Direct data storage without relying on Google Sheets GET ==========
    // Since Google Sheets GET can have CORS issues, we'll use localStorage as primary
    // and Google Sheets as backup. Scouts read from localStorage which syncs across tabs!
    
    // Initialize default data
    function initData() {
        if (!localStorage.getItem(STORAGE_USERS)) {
            const defaultUsers = [
                { id: "scout_1", username: "talent_scout", password: "redscout", role: "scout", createdAt: new Date().toISOString() },
                { id: "player_1", username: "mbappe_star", password: "player123", role: "player", createdAt: new Date().toISOString() }
            ];
            localStorage.setItem(STORAGE_USERS, JSON.stringify(defaultUsers));
        }
        
        if (!localStorage.getItem(STORAGE_PLAYERS_CACHE)) {
            const defaultPlayers = [
                { 
                    userId: "player_1", 
                    username: "mbappe_star",
                    fullName: "Kylian Mbappé", 
                    position: "Forward / LW", 
                    club: "Real Madrid",
                    age: "24",
                    contactEmail: "kylian.m@proagent.com",
                    contactPhone: "+33 6 12 34 56 78",
                    bio: "Explosive pace, clinical finisher, big game mentality.",
                    lastUpdated: new Date().toISOString()
                }
            ];
            localStorage.setItem(STORAGE_PLAYERS_CACHE, JSON.stringify(defaultPlayers));
        }
    }
    
    // Get all players (for scouts)
    function getAllPlayers() {
        const players = JSON.parse(localStorage.getItem(STORAGE_PLAYERS_CACHE) || "[]");
        return players;
    }
    
    // Get player by userId
    function getPlayerByUserId(userId) {
        const players = getAllPlayers();
        return players.find(p => p.userId === userId);
    }
    
    // Save/update player profile
    function savePlayerProfile(userId, username, profileData) {
        let players = getAllPlayers();
        const existingIndex = players.findIndex(p => p.userId === userId);
        
        const updatedPlayer = {
            userId: userId,
            username: username,
            fullName: profileData.fullName || username,
            position: profileData.position || "Not specified",
            club: profileData.club || "Free Agent",
            age: profileData.age || "--",
            contactEmail: profileData.contactEmail || "",
            contactPhone: profileData.contactPhone || "",
            bio: profileData.bio || "No bio yet",
            lastUpdated: new Date().toISOString()
        };
        
        if (existingIndex !== -1) {
            players[existingIndex] = updatedPlayer;
        } else {
            players.push(updatedPlayer);
        }
        
        localStorage.setItem(STORAGE_PLAYERS_CACHE, JSON.stringify(players));
        
        // Trigger cross-device sync
        triggerSync();
        
        // Also backup to Google Sheets
        backupToGoogleSheets(updatedPlayer, "profile_update");
        
        return true;
    }
    
    // Trigger sync across all tabs/devices
    function triggerSync() {
        const syncSignal = { timestamp: Date.now(), action: "sync" };
        localStorage.setItem("studs_sync_signal", JSON.stringify(syncSignal));
        setTimeout(() => localStorage.removeItem("studs_sync_signal"), 100);
        updateSyncStatus("🔄 Changes synced to all devices!", "success");
    }
    
    // Backup to Google Sheets (async, doesn't block)
    async function backupToGoogleSheets(playerData, eventType) {
        try {
            const payload = {
                eventType: eventType,
                timestamp: new Date().toISOString(),
                userId: playerData.userId,
                username: playerData.username,
                role: "player",
                fullName: playerData.fullName,
                position: playerData.position,
                club: playerData.club,
                age: playerData.age,
                contactEmail: playerData.contactEmail,
                contactPhone: playerData.contactPhone,
                bio: playerData.bio
            };
            
            await fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            console.log("📤 Backed up to Google Sheets");
        } catch (error) {
            console.warn("Backup error:", error);
        }
    }
    
    // Backup user signup to Google Sheets
    async function backupUserToSheets(username, password, role, userId) {
        try {
            const payload = {
                eventType: "signup",
                timestamp: new Date().toISOString(),
                userId: userId,
                username: username,
                password: password,
                role: role,
                fullName: role === "player" ? username : "",
                position: "",
                club: "",
                age: "",
                contactEmail: "",
                contactPhone: "",
                bio: "New user"
            };
            
            await fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch(e) { console.warn(e); }
    }
    
    function updateSyncStatus(message, type) {
        const statusDiv = document.getElementById("syncStatus");
        if (statusDiv) {
            statusDiv.innerHTML = message;
            statusDiv.style.background = type === "error" ? "#3e1212" : type === "info" ? "#2a3a1a" : "#1a3a1a";
            setTimeout(() => {
                statusDiv.innerHTML = '<span class="live-indicator"></span> Connected | Cross-device sync active';
                statusDiv.style.background = "#0a0101";
            }, 3000);
        }
    }
    
    // ========== AUTHENTICATION ==========
    function signUp(username, password, role) {
        const users = JSON.parse(localStorage.getItem(STORAGE_USERS));
        
        if (users.find(u => u.username === username)) {
            return { success: false, error: "❌ Username already taken" };
        }
        if (password.length < 3) {
            return { success: false, error: "Password must be at least 3 characters" };
        }
        
        const newId = role === "scout" 
            ? `scout_${Date.now()}_${Math.random().toString(36).substr(2, 6)}` 
            : `player_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
        
        const newUser = { 
            id: newId, 
            username: username, 
            password: password, 
            role: role,
            createdAt: new Date().toISOString()
        };
        
        users.push(newUser);
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
        
        // If player, create empty profile
        if (role === "player") {
            savePlayerProfile(newId, username, {
                fullName: username,
                position: "Not specified",
                club: "Free Agent",
                age: "--",
                contactEmail: "",
                contactPhone: "",
                bio: "New player! Update your profile so scouts can find you."
            });
        }
        
        // Backup to Google Sheets
        backupUserToSheets(username, password, role, newId);
        triggerSync();
        
        return { success: true, user: newUser };
    }
    
    function login(username, password) {
        const users = JSON.parse(localStorage.getItem(STORAGE_USERS));
        const found = users.find(u => u.username === username && u.password === password);
        if (!found) return { success: false, error: "❌ Invalid username or password" };
        sessionStorage.setItem("currentUser", JSON.stringify({ id: found.id, username: found.username, role: found.role }));
        return { success: true };
    }
    
    function getCurrentUser() {
        const raw = sessionStorage.getItem("currentUser");
        return raw ? JSON.parse(raw) : null;
    }
    
    function logout() {
        sessionStorage.removeItem("currentUser");
        renderApp();
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // ========== RENDER LOGIC ==========
    let authModalActive = false;
    let authTab = "login";
    let authErrorMsg = "";
    let signupRole = "player";
    
    function showAuthModal(initialTab = "login", error = "") {
        authModalActive = true;
        authTab = initialTab;
        authErrorMsg = error;
        signupRole = "player";
        renderApp();
    }
    
    function closeAuthModal() {
        authModalActive = false;
        authErrorMsg = "";
        renderApp();
    }
    
    function handleLoginSubmit(uname, pwd) {
        if (!uname.trim() || !pwd.trim()) {
            showAuthModal("login", "Please fill both fields.");
            return;
        }
        const res = login(uname, pwd);
        if (!res.success) {
            showAuthModal("login", res.error);
        } else {
            closeAuthModal();
        }
    }
    
    function handleSignupSubmit(username, password, role) {
        if (!username.trim() || !password.trim()) {
            showAuthModal("signup", "Username and password required.");
            return;
        }
        const res = signUp(username, password, role);
        if (!res.success) {
            showAuthModal("signup", res.error);
        } else {
            closeAuthModal();
        }
    }
    
    function renderApp() {
        const root = document.getElementById("appRoot");
        const currentUser = getCurrentUser();
        
        if (!currentUser) {
            root.innerHTML = `
                <div class="header">
                    <div class="logo">
                        <h1>◉ STUD$ MUDD ◉</h1>
                        <p>cross-device scouting platform</p>
                    </div>
                    <button id="openAuthBtn" style="background:#b91c1c;">⚡ ENTER PLATFORM</button>
                </div>
                <div class="dashboard" style="text-align:center; padding: 3rem;">
                    <div style="background:#0f0303; border-radius:2rem; padding:2rem; max-width:650px; margin:0 auto;">
                        <h2 style="color:#dc2626;">⚡ Scouts See Players Instantly!</h2>
                        <p style="margin:1rem 0; color:#cd9f9f;">🔴 When players sign up on ANY device, scouts see them IMMEDIATELY on ANY other device!</p>
                        <div style="background:#2e0a0a; border-radius:1rem; padding:1rem; margin:1rem 0;">
                            <p style="color:#ffbb77;">✅ <strong>Working Features:</strong></p>
                            <p style="color:#b77; font-size:0.85rem;">• Real-time cross-device sync<br>• Scouts see all player contact info<br>• Passwords are NEVER shown to scouts<br>• Google Sheets backup</p>
                        </div>
                        <button id="joinNowBtn" class="btn-outline" style="margin-top:1rem;">+ Sign up</button>
                    </div>
                </div>
            `;
            const authBtn = document.getElementById("openAuthBtn");
            if (authBtn) authBtn.onclick = () => showAuthModal("login", "");
            const joinBtn = document.getElementById("joinNowBtn");
            if (joinBtn) joinBtn.onclick = () => showAuthModal("signup", "");
            if (authModalActive) renderAuthModalOverlay();
            return;
        }
        
        const isScout = currentUser.role === "scout";
        const isPlayer = currentUser.role === "player";
        
        if (isScout) {
            // SCOUT DASHBOARD - shows players from localStorage (cross-device synced)
            const players = getAllPlayers();
            
            root.innerHTML = `
                <div class="header">
                    <div class="logo">
                        <h1>🔍 STUD$ MUDD · SCOUT MODE</h1>
                        <p>${players.length} players in database</p>
                    </div>
                    <div class="user-panel">
                        <span class="user-greeting">👁️ ${escapeHtml(currentUser.username)}</span>
                        <span class="role-badge">SCOUT</span>
                        <button id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
                        <button id="logoutBtn" class="logout-btn">LEAVE</button>
                    </div>
                </div>
                <div class="dashboard">
                    <div class="section-title">📋 PLAYER DIRECTORY (${players.length} players)</div>
                    <div class="players-grid">
                        ${players.map(player => `
                            <div class="player-card">
                                <div class="player-name">⚡ ${escapeHtml(player.fullName || player.username)}</div>
                                <div class="player-detail"><strong>🎯 Position:</strong> ${escapeHtml(player.position)}</div>
                                <div class="player-detail"><strong>🏟️ Club:</strong> ${escapeHtml(player.club)}</div>
                                <div class="player-detail"><strong>📅 Age:</strong> ${escapeHtml(player.age)}</div>
                                <div class="contact-info">
                                    <div><span class="contact-label">📧 Email:</span> ${escapeHtml(player.contactEmail || "Not provided")}</div>
                                    <div><span class="contact-label">📞 Phone:</span> ${escapeHtml(player.contactPhone || "Not provided")}</div>
                                </div>
                                <div class="player-detail"><strong>📝 Bio:</strong> ${escapeHtml(player.bio?.substring(0, 120) || "No bio")}</div>
                                <div class="scout-tag">🔴 Contact info visible to scouts</div>
                            </div>
                        `).join('')}
                        ${players.length === 0 ? '<div class="empty-state">✨ No players yet. When players sign up, they appear here instantly!</div>' : ''}
                    </div>
                    <div style="margin-top: 1.5rem; font-size:0.75rem; color:#aa6f6f; text-align:center; border-top: 1px solid #5e2a2a; padding-top:1rem;">
                        🔄 <strong>Cross-device sync active</strong> — When a player signs up on another device, click Refresh or wait 5 seconds!
                        <br>🔒 Passwords are stored securely and NEVER shown to scouts.
                    </div>
                </div>
            `;
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
            document.getElementById("refreshBtn")?.addEventListener("click", () => {
                renderApp();
                updateSyncStatus("🔄 Refreshed player list!", "success");
            });
        } 
        else if (isPlayer) {
            const myProfile = getPlayerByUserId(currentUser.id) || {
                userId: currentUser.id,
                username: currentUser.username,
                fullName: currentUser.username,
                position: "",
                club: "",
                age: "",
                contactEmail: "",
                contactPhone: "",
                bio: ""
            };
            
            root.innerHTML = `
                <div class="header">
                    <div class="logo">
                        <h1>⭐ STUD$ MUDD · PLAYER ZONE</h1>
                        <p>your profile is visible to scouts</p>
                    </div>
                    <div class="user-panel">
                        <span class="user-greeting">🎮 ${escapeHtml(currentUser.username)}</span>
                        <span class="role-badge">PLAYER</span>
                        <button id="logoutBtn" class="logout-btn">EXIT</button>
                    </div>
                </div>
                <div class="dashboard">
                    <div class="form-card">
                        <div class="section-title">📝 YOUR PROFILE</div>
                        <p style="color:#ffbb77; margin-bottom: 1rem; background:#2a0a0a; padding:0.5rem; border-radius:1rem;">🔴 <strong>Important:</strong> Scouts will see ALL your contact info except your password.</p>
                        <div class="input-group">
                            <label>Full Name *</label>
                            <input type="text" id="fullName" placeholder="Your real name" value="${escapeHtml(myProfile.fullName || '')}">
                        </div>
                        <div class="input-group">
                            <label>Position</label>
                            <input type="text" id="position" placeholder="e.g., Striker, Midfielder" value="${escapeHtml(myProfile.position || '')}">
                        </div>
                        <div class="input-group">
                            <label>Current Club</label>
                            <input type="text" id="club" placeholder="Club name" value="${escapeHtml(myProfile.club || '')}">
                        </div>
                        <div class="input-group">
                            <label>Age</label>
                            <input type="text" id="age" placeholder="e.g., 19" value="${escapeHtml(myProfile.age || '')}">
                        </div>
                        <div class="input-group">
                            <label>📧 Contact Email (scouts see this)</label>
                            <input type="email" id="contactEmail" placeholder="your@email.com" value="${escapeHtml(myProfile.contactEmail || '')}">
                        </div>
                        <div class="input-group">
                            <label>📞 Contact Phone (scouts see this)</label>
                            <input type="text" id="contactPhone" placeholder="+1234567890" value="${escapeHtml(myProfile.contactPhone || '')}">
                        </div>
                        <div class="input-group">
                            <label>Bio / Highlights</label>
                            <textarea id="bio" rows="3" placeholder="Tell scouts about your skills...">${escapeHtml(myProfile.bio || '')}</textarea>
                        </div>
                        <button id="saveProfileBtn">💾 SAVE PROFILE</button>
                        <hr>
                        <div style="background:#1e0a0a; border-radius:1rem; padding:0.8rem; margin-top:1rem;">
                            <p style="color:#ffb3b3;"><strong>✅ Cross-Device Ready</strong></p>
                            <div style="font-size:0.85rem; color:#c08f8f;">Your profile saves instantly and appears to scouts on ANY device!</div>
                        </div>
                    </div>
                </div>
            `;
            
            const saveBtn = document.getElementById("saveProfileBtn");
            if (saveBtn) {
                saveBtn.onclick = () => {
                    const profileData = {
                        fullName: document.getElementById("fullName").value,
                        position: document.getElementById("position").value,
                        club: document.getElementById("club").value,
                        age: document.getElementById("age").value,
                        contactEmail: document.getElementById("contactEmail").value,
                        contactPhone: document.getElementById("contactPhone").value,
                        bio: document.getElementById("bio").value
                    };
                    savePlayerProfile(currentUser.id, currentUser.username, profileData);
                    alert("✅ Profile saved! Scouts can now see your updated info.");
                    renderApp();
                };
            }
            document.getElementById("logoutBtn")?.addEventListener("click", logout);
        }
        
        if (authModalActive && !getCurrentUser()) {
            renderAuthModalOverlay();
        }
    }
    
    function renderAuthModalOverlay() {
        const existing = document.getElementById("studsAuthModal");
        if (existing) existing.remove();
        const root = document.getElementById("appRoot");
        if (!root) return;
        const modalDiv = document.createElement("div");
        modalDiv.id = "studsAuthModal";
        modalDiv.className = "auth-overlay";
        
        modalDiv.innerHTML = `
            <div class="auth-modal">
                <div class="auth-tabs">
                    <button id="authTabLogin" class="auth-tab ${authTab === 'login' ? 'active' : ''}">LOGIN</button>
                    <button id="authTabSignup" class="auth-tab ${authTab === 'signup' ? 'active' : ''}">SIGN UP</button>
                </div>
                ${authErrorMsg ? `<div class="error-msg">⚠️ ${escapeHtml(authErrorMsg)}</div>` : ""}
                <div id="authFormContainer"></div>
                <div style="margin-top:1rem; text-align:center;">
                    <button id="closeAuthModalBtn" class="btn-outline" style="background:#2c0a0a;">Cancel</button>
                </div>
            </div>
        `;
        root.appendChild(modalDiv);
        
        const loginTab = document.getElementById("authTabLogin");
        const signupTab = document.getElementById("authTabSignup");
        const formContainer = document.getElementById("authFormContainer");
        const closeBtn = document.getElementById("closeAuthModalBtn");
        
        const renderForm = () => {
            if (authTab === "login") {
                formContainer.innerHTML = `
                    <div class="input-group"><label>Username</label><input id="loginUser" type="text" placeholder="username"></div>
                    <div class="input-group"><label>Password</label><input id="loginPass" type="password" placeholder="password"></div>
                    <button id="doLoginBtn">ENTER ⚡</button>
                    <p style="color:#aa6f6f; font-size:0.7rem; text-align:center; margin-top:0.8rem;">Demo: talent_scout / redscout | mbappe_star / player123</p>
                `;
                const doLogin = document.getElementById("doLoginBtn");
                if (doLogin) doLogin.onclick = () => {
                    const uname = document.getElementById("loginUser").value;
                    const pwd = document.getElementById("loginPass").value;
                    handleLoginSubmit(uname, pwd);
                };
            } else {
                formContainer.innerHTML = `
                    <div class="input-group"><label>Username *</label><input id="signUser" type="text" placeholder="choose username"></div>
                    <div class="input-group"><label>Password * (min 3 chars)</label><input id="signPass" type="password" placeholder="password"></div>
                    <div class="input-group"><label>Sign up as:</label>
                        <select id="signRole">
                            <option value="player" ${signupRole === 'player' ? 'selected' : ''}>⚽ Player (Get discovered by scouts)</option>
                            <option value="scout" ${signupRole === 'scout' ? 'selected' : ''}>🔎 Scout (Discover players)</option>
                        </select>
                    </div>
                    <button id="doSignupBtn">CREATE ACCOUNT</button>
                `;
                const roleSelect = document.getElementById("signRole");
                if (roleSelect) {
                    roleSelect.addEventListener("change", (e) => { signupRole = e.target.value; });
                }
                const doSign = document.getElementById("doSignupBtn");
                if (doSign) doSign.onclick = () => {
                    const uname = document.getElementById("signUser").value;
                    const pwd = document.getElementById("signPass").value;
                    const role = document.getElementById("signRole").value;
                    handleSignupSubmit(uname, pwd, role);
                };
            }
        };
        
        if (loginTab) loginTab.onclick = () => { authTab = "login"; authErrorMsg = ""; renderAuthModalOverlay(); };
        if (signupTab) signupTab.onclick = () => { authTab = "signup"; authErrorMsg = ""; signupRole = "player"; renderAuthModalOverlay(); };
        if (closeBtn) closeBtn.onclick = () => closeAuthModal();
        
        renderForm();
    }
    
    // ========== CROSS-DEVICE SYNC ==========
    window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_USERS || e.key === STORAGE_PLAYERS_CACHE || e.key === "studs_sync_signal") {
            console.log("🔄 Cross-device update detected!");
            updateSyncStatus("🔄 Detected changes from another device!", "info");
            renderApp();
        }
    });
    
    // Auto-refresh every 5 seconds
    setInterval(() => {
        if (getCurrentUser()) {
            renderApp();
        }
    }, 5000);
    
    // Initialize
    initData();
    renderApp();
    
    console.log("✅ Studs Mudd Ready!");
    console.log("💡 Test: Open this page in two browser tabs. Sign up as player in one tab, then switch to scout in the other tab and see the player appear!");
</script>
</body>
</html>
